# Только настройки инструментов. Зависимости: requirements.txt / requirements-dev.txt.

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["ttmon"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# strict-набор (флаг strict глобальный, per-module перечисляется вручную)
[[tool.mypy.overrides]]
module = ["ttmon.ai.*", "ttmon.report.*", "ttmon.db.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# у googleapiclient, google_auth_oauthlib и httplib2 нет типов: ответы API — dict, разбираются вручную
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "httplib2"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
